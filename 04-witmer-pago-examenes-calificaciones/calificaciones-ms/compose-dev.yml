version: '3.8'

services:
  calificaciones-db:
    image: postgres:16-alpine
    container_name: eduspace-calificaciones-db-dev
    environment:
      POSTGRES_DB: calificaciones_db
      POSTGRES_USER: eduspace
      POSTGRES_PASSWORD: eduspace
      TZ: America/Lima
    ports:
      - "15445:5432"
    volumes:
      - calificaciones_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduspace -d calificaciones_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  calificaciones_db_data:

